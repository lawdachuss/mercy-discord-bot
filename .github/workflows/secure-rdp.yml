name: Secure RDP + Mercy Bot

# Never scheduled: no `schedule:`/cron trigger on this workflow, now or later.
#
# workflow_dispatch is the only trigger. Each run queues its own successor, which
# waits in the rdp-session group and starts the moment this run ends, so the bot
# stays up 24/7 by chaining rather than by a timer. The successor always runs the
# default branch, so an experiment on another branch cannot hijack the loop. A
# session that runs its full keep-alive resets the retry counter; a bot that
# keeps failing is retried for 5 links, then the chain stops and alerts instead
# of looping forever (fix whatever broke, then start one run by hand).
on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'session-chain:<n> (automatic) | workflow-watchman | blank if manual'
        required: false
        default: ''

concurrency:
  group: rdp-session
  cancel-in-progress: false

permissions:
  contents: read
  actions: write    # a run queues its own successor

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4

      - name: Queue the next session (early insurance)
        # Runs before the bot, so a session lost later in the run (dead runner,
        # cancelled job, timeout) still has a successor waiting. It queues
        # pessimistically as a retry; the end-of-run step replaces it with a
        # reset counter when the bot comes up, and `queue: single` keeps exactly
        # one waiting, never two sessions.
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGERED_BY: ${{ inputs.triggered_by }}
          CHAIN_REF: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          # Retry state travels in the dispatch input: session-chain:<n> counts
          # consecutive runs whose bot never came up (blank = manual = 0). The
          # input is a string, so it is parsed here, never injected into code.
          # The digit count is capped so an absurd hand-typed value cannot
          # overflow the [int] cast and hard-fail the step before it dispatches.
          $n = 0
          if ($env:TRIGGERED_BY -match '^session-chain:(\d{1,9})$') { $n = [int]$Matches[1] }
          $maxRetries = 5

          if ($n + 1 -gt $maxRetries) {
            Write-Host "Retry budget spent ($n/$maxRetries) - not queueing; the end-of-run step reports a stopped chain."
            return
          }

          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/secure-rdp.yml/dispatches"
          $body = @{ ref = $env:CHAIN_REF; inputs = @{ triggered_by = "session-chain:$($n + 1)" } } | ConvertTo-Json

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-RestMethod -Method Post -Uri $uri -Body $body -ContentType "application/json" `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              Write-Host "Successor queued for $env:CHAIN_REF (retry $($n + 1)/$maxRetries)."
              return
            } catch {
              Write-Host "::warning::Dispatch attempt $attempt failed: $($_.Exception.Message) $($_.ErrorDetails.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
            }
          }
          Write-Host "::error::Could not queue the next session from the insurance step."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore venv cache
        id: cache-venv
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Create venv & install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt
          .venv\Scripts\python -c "import discord; print(f'discord.py {discord.__version__}')"

      - name: Save venv cache
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}

      - name: Setup RDP + Tailscale
        shell: powershell
        run: |
          $wd = "${{ github.workspace }}"
          Set-Location -LiteralPath $wd

          New-Item -ItemType Directory -Force -Path "C:\rdp-session" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.cache" | Out-Null

          $cachedTs = "${{ github.workspace }}\.cache\tailscale.msi"
          if (-not (Test-Path $cachedTs)) {
            Write-Host "=== Downloading Tailscale ==="
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $cachedTs
          } else {
            Write-Host "=== Tailscale already cached ==="
          }

          Write-Host "=== Configuring RDP ==="
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force

          Write-Host "=== Creating RDP user ==="
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#"
          $password = -join ((1..20) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) { Remove-LocalUser -Name "RDP" }
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
            Write-Host "=== Installing Tailscale ==="
            Start-Process msiexec.exe -ArgumentList "/i `"$cachedTs`" /qn /norestart" -Wait
          } else {
            Write-Host "=== Tailscale already installed ==="
          }
          Write-Host "Setup complete."

      - name: Finalize Setup (session metadata + user dirs)
        shell: powershell
        run: |

          # Every session gets a fresh VM, so the previous session's
          # C:\rdp-session\session.json cannot exist here and the old "cached"
          # counter could only ever read 1. The run number is monotonic and one
          # run is exactly one session, so it is the honest number.
          Write-Host "=== Session metadata ==="
          $runCount = ${{ github.run_number }}
          $createdAt = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "CACHED_RUN_COUNT=$runCount"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CACHED_CREATED_AT=$createdAt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Session: #$runCount | Created: $createdAt"

          $rdpHome = "C:\Users\RDP"
          if (-not (Test-Path $rdpHome)) {
            New-Item -ItemType Directory -Force -Path $rdpHome | Out-Null
          }
          @("Desktop","Documents","Downloads","Pictures","Videos","Music") | ForEach-Object {
            $p = "$rdpHome\$_"
            if (-not (Test-Path $p)) { New-Item -ItemType Directory -Force -Path $p | Out-Null }
          }

      - name: Connect Tailscale
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $hostname  = "mercy-bot-${{ github.run_id }}"
          $authkey   = "${{ secrets.TAILSCALE_KEY }}".Trim()
          "TAILSCALE_OK=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Fail-soft on purpose: an invalid/expired TAILSCALE_KEY used to crash
          # the whole job here, which killed the bot session along with it.
          # RDP is access convenience — the bot must keep running either way.
          if (-not $authkey) {
            Write-Host "::warning::TAILSCALE_KEY secret is empty - starting WITHOUT RDP access."
            "TAILSCALE_OK=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return
          }
          if ($authkey -notlike "tskey-*") {
            Write-Host "::warning::TAILSCALE_KEY does not look like a Tailscale auth key (expected tskey-auth-...). If 'invalid key' appears below, regenerate it at https://login.tailscale.com/admin/settings/keys"
          }

          $ip = $null
          try {
            Start-Service Tailscale
            Start-Sleep -Seconds 5

            foreach ($attempt in 1..2) {
              & $tailscale up --authkey="$authkey" --hostname="$hostname" --accept-routes --reset
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 1) { Write-Host "tailscale up failed (attempt 1), retrying in 15s..."; Start-Sleep -Seconds 15 }
            }

            if ($LASTEXITCODE -eq 0) {
              for ($i = 0; $i -lt 20; $i++) {
                try { $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim() } catch {}
                if ($ip) { break }
                Start-Sleep -Seconds 3
              }
            }
          } catch {
            Write-Host "::warning::Tailscale setup threw: $($_.Exception.Message)"
            $ip = $null
          }

          if (-not $ip) {
            Write-Host "::warning::Tailscale tunnel is down (invalid or expired TAILSCALE_KEY?) - the bot is starting WITHOUT RDP access. Fix: create a new auth key at https://login.tailscale.com/admin/settings/keys and update the TAILSCALE_KEY Actions secret, then start a new session."
            "TAILSCALE_OK=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return
          }

          "TAILSCALE_IP=$ip"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TS_HOSTNAME=$hostname" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tailscale IP: $ip"

      - name: Start Mercy Bot + Keep Alive
        shell: powershell
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          OWNER_IDS: ${{ secrets.OWNER_IDS }}
          AUTO_SYNC_COMMANDS: "true"
        run: |
          $wd = "${{ github.workspace }}"

          $job = Start-Job -Name "mercybot" -ScriptBlock {
            param($wd, $token, $webhook, $mongo, $owners)
            Set-Location -LiteralPath $wd
            $env:DISCORD_TOKEN = $token
            $env:WEBHOOK_URL = $webhook
            $env:MONGO_URL = $mongo
            $env:OWNER_IDS = $owners
            $env:AUTO_SYNC_COMMANDS = "true"
            & "$wd\.venv\Scripts\python" -u main.py
          } -ArgumentList $wd, $env:DISCORD_TOKEN, $env:WEBHOOK_URL, $env:MONGO_URL, $env:OWNER_IDS

          $ready = $false
          $startupDeadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $startupDeadline) {
            $output = Receive-Job $job -ErrorAction SilentlyContinue
            if ($output) {
              $output | ForEach-Object { Write-Host $_ }
              if (($output -join "`n") -match "Logged in as|Bot ready:") {
                $ready = $true
              }
            }

            if ($job.State -eq "Failed" -or $job.State -eq "Completed" -or $job.State -eq "Stopped") {
              Write-Host "::error::Bot exited before becoming ready"
              Receive-Job $job -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              exit 1
            }
            if ($ready) { break }
            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            Write-Host "::error::Bot did not become ready within 120 seconds"
            Receive-Job $job -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            exit 1
          }

          # Show connection details once
          $runCount = [int]$env:CACHED_RUN_COUNT
          $tsDown = ($env:TAILSCALE_OK -eq "false")
          Write-Host ""
          Write-Host "======================================="
          if ($tsDown) {
            Write-Host "  MERCY BOT READY (RDP/TAILSCALE DOWN)"
          } else {
            Write-Host "        MERCY BOT + RDP READY"
          }
          Write-Host "======================================="
          if ($tsDown) {
            Write-Host "Tailscale    : DOWN - no RDP access this session (renew TAILSCALE_KEY)"
          } else {
            Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          }
          Write-Host "Username     : RDP"
          Write-Host "Password     : $env:RDP_PASSWORD"
          Write-Host "Session #    : $runCount"
          Write-Host "Bot PID      : (see job output above)"
          Write-Host "======================================="

          # Keep Alive: stream bot output + keep runner alive.
          # 330, not the job's 360-minute cap: setup can take minutes on a cold
          # cache, and a session that is killed by the cap never reaches the
          # SESSION_COMPLETE write below, which would make a healthy session
          # count as a failure link and eventually stop the chain.
          $endTime = (Get-Date).AddMinutes(330)
          while ((Get-Date) -lt $endTime) {
            $ts = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $output = Receive-Job $job -ErrorAction SilentlyContinue
            if ($output) { $output | ForEach-Object { Write-Host $_ } }

            if ($job.State -eq "Failed") {
              Write-Host "::error::Bot crashed"
              Receive-Job $job -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              exit 1
            }
            if ($job.State -eq "Completed" -or $job.State -eq "Stopped") {
              Write-Host "::error::Bot exited unexpectedly"
              Receive-Job $job -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              exit 1
            }

            Write-Host "[$ts] Bot alive (PID via job)..."
            Start-Sleep -Seconds 30
          }

          # Only a keep-alive that runs its full 330 minutes gets here. That is
          # the healthy-session signal: the end-of-run chain step resets its
          # retry counter on it and counts up when it is missing (bot never
          # started, crashed, or exited early).
          "SESSION_COMPLETE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Queue the next session (session end)
        # The chain link: starts the next session when this one ends, even if the
        # bot crashed (`if: always()`). A session that ran its full keep-alive
        # resets the retry counter; anything else (never started, crashed, exited
        # early) counts up, and once the budget is spent the chain stops with a
        # Discord alert rather than restarting a broken bot forever. This is the
        # bound the old watchman's 8/24h throttle used to provide.
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGERED_BY: ${{ inputs.triggered_by }}
          CHAIN_REF: ${{ github.event.repository.default_branch || github.ref_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Digit count capped like the insurance step, so the cast below can
          # never throw on an out-of-range hand-typed counter.
          $n = 0
          if ($env:TRIGGERED_BY -match '^session-chain:(\d{1,9})$') { $n = [int]$Matches[1] }
          $maxRetries = 5

          $next = $n + 1
          if ($env:SESSION_COMPLETE -eq "true") { $next = 0 }

          if ($next -gt $maxRetries) {
            $stopReason = "$n sessions in a row ended early or never started"
          } else {
            $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/secure-rdp.yml/dispatches"
            $body = @{ ref = $env:CHAIN_REF; inputs = @{ triggered_by = "session-chain:$next" } } | ConvertTo-Json

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-RestMethod -Method Post -Uri $uri -Body $body -ContentType "application/json" `
                  -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
                Write-Host "Successor queued for $env:CHAIN_REF (retry $next/$maxRetries)."
                return
              } catch {
                Write-Host "::warning::Dispatch attempt $attempt failed: $($_.Exception.Message) $($_.ErrorDetails.Message)"
                if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
              }
            }
            $stopReason = "GitHub refused the dispatch (see the warnings above)"
          }

          Write-Host "::error::Session chain stopped: $stopReason. The bot is down until a run is started."
          if ($env:DISCORD_WEBHOOK_URL) {
            try {
              $alert = @{ content = ":warning: **mercy-discord-bot** session chain stopped: $stopReason. Start a run: https://github.com/$env:GITHUB_REPOSITORY/actions/workflows/secure-rdp.yml" } | ConvertTo-Json
              Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -Body $alert -ContentType "application/json" | Out-Null
              Write-Host "Discord alert sent."
            } catch {
              Write-Host "::warning::Discord alert failed: $($_.Exception.Message)"
            }
          } else {
            Write-Host "::warning::WEBHOOK_URL is not set - no Discord alert sent."
          }

      - name: Save Session Metadata
        if: always()
        shell: powershell
        run: |
          $runCount = [int]$env:CACHED_RUN_COUNT
          New-Item -ItemType Directory -Force -Path "C:\rdp-session" | Out-Null
          $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $createdAt = $env:CACHED_CREATED_AT
          if (-not $createdAt) { $createdAt = $now }
          @{
            hostname     = "$env:TS_HOSTNAME"
            tailscale_ip = "$env:TAILSCALE_IP"
            run_count    = $runCount
            created_at   = $createdAt
            last_run_at  = $now
            last_run_id  = "${{ github.run_id }}"
          } | ConvertTo-Json | Set-Content "C:\rdp-session\session.json" -Encoding utf8
          Write-Host "Session saved. Total: $runCount"
