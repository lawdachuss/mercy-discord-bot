name: Mercy Session Recovery

# Event-driven recovery. This is separate from secure-rdp.yml:
# it runs as soon as that workflow reaches a terminal state.
on:
  workflow_run:
    workflows:
      - Secure RDP + Mercy Bot
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  recover:
    # A manually cancelled session must stay cancelled.
    # Retry success, failure, timeout, and other non-cancelled conclusions.
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Avoid duplicate sessions
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/secure-rdp.yml/runs?per_page=30")"
          active="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<< "$runs")"
          if [ "$active" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An RDP session is already queued or running; not dispatching a duplicate."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the next RDP session
        if: steps.active.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/secure-rdp.yml/dispatches" \
            -f ref=master
          echo "A replacement RDP session was dispatched."
